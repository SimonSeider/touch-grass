<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Touch Grass</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #a8d8c8;
    }

    canvas {
      display: block;
    }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 10;
    }

    #ui {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.9);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      pointer-events: none;
      z-index: 10;
      background: rgba(18, 34, 30, 0.30);
      border: 1px solid rgba(255, 255, 255, 0.10);
      padding: 8px 18px;
      border-radius: 30px;
      user-select: none;
    }

    #menu {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: radial-gradient(120% 90% at 50% 45%, rgba(14, 22, 20, 0.04), rgba(14, 22, 20, 0.22));
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms;
    }

    #menu.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #menu .panel {
      position: relative;
      width: min(380px, 88vw);
      padding: 30px 32px 26px;
      border-radius: 28px;
      overflow: hidden;
      color: #16211d;
      user-select: none;
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 30px 70px rgba(10, 22, 18, 0.34),
        0 2px 10px rgba(10, 22, 18, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.85),
        inset 0 -1px 0 rgba(255, 255, 255, 0.28);
      background: rgba(246, 250, 247, 0.42);
      transform: translateY(10px) scale(0.96);
      transition: transform 300ms cubic-bezier(0.18, 0.9, 0.26, 1);
    }

    #menu.open .panel {
      transform: none;
    }

    #menu #glassbg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      z-index: 0;
    }

    #menu .panel-inner {
      position: relative;
      z-index: 1;
    }

    #menu .panel-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.2px;
      text-transform: uppercase;
      color: rgba(22, 33, 29, 0.48);
      margin-bottom: 20px;
      text-align: center;
    }

    #menu .panel-label::after {
      content: '';
      display: block;
      height: 1px;
      margin: 14px -6px 0;
      background: linear-gradient(to right,
          rgba(22, 33, 29, 0), rgba(22, 33, 29, 0.16), rgba(22, 33, 29, 0));
    }

    #menu .row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    #menu .row .name {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
      color: rgba(22, 33, 29, 0.88);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    #menu .row .name small {
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: rgba(22, 33, 29, 0.45);
    }

    #menu input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 4px;
      background:
        linear-gradient(to right,
          #5f9c7d var(--fill, 50%), rgba(22, 33, 29, 0.14) var(--fill, 50%));
      box-shadow: inset 0 1px 2px rgba(10, 22, 18, 0.18), 0 1px 0 rgba(255, 255, 255, 0.5);
      outline: none;
      cursor: pointer;
    }

    #menu input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #eef3ef 70%);
      border: 1px solid rgba(10, 22, 18, 0.10);
      box-shadow: 0 2px 6px rgba(10, 22, 18, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transition: transform 120ms ease;
    }

    #menu input[type="range"]:active::-webkit-slider-thumb {
      transform: scale(1.12);
    }

    #menu input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #eef3ef 70%);
      border: 1px solid rgba(10, 22, 18, 0.10);
      box-shadow: 0 2px 6px rgba(10, 22, 18, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    #menu .hint {
      margin-top: 2px;
      font-size: 11.5px;
      letter-spacing: 0.4px;
      text-align: center;
      color: rgba(22, 33, 29, 0.42);
    }

    #menu .hint kbd {
      font: inherit;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(22, 33, 29, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
      color: rgba(22, 33, 29, 0.6);
    }

    .separator {
        border: none;
        border-top: 1px solid #444;
        margin: 20px 0;
    }

    .row-toggle {
        flex-direction: row !important;
        justify-content: space-between;
        align-items: center;
    }

    .switch {
        position: relative;
        display: inline-block;
        width: 42px;
        height: 24px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        inset: 0;
        background-color: rgba(22, 33, 29, 0.14);
        border-radius: 24px;
        box-shadow: inset 0 1px 2px rgba(10, 22, 18, 0.18), 0 1px 0 rgba(255, 255, 255, 0.5);
        transition: background-color 0.2s ease;
    }

    .slider::before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background: radial-gradient(circle at 35% 30%, #ffffff, #eef3ef 70%);
        border-radius: 50%;
        box-shadow: 0 2px 4px rgba(10, 22, 18, 0.2);
        transition: transform 0.2s cubic-bezier(0.18, 0.9, 0.26, 1);
    }

    .switch input:checked + .slider {
        background-color: #5f9c7d;
    }

    .switch input:checked + .slider::before {
        transform: translateX(18px);
    }
  </style>
</head>

<body>
  <div id="menu">
    <div class="panel">
      <canvas id="glassbg"></canvas>
      <div class="panel-inner">
        <div class="panel-label">Paused</div>
        <div class="row row-toggle">
            <div class="name">Auto Exposure</div>
            <label class="switch">
                <input type="checkbox" id="AutoExposureToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
        <div class="row">
            <div class="row">
                <div class="name">Shutter Speed <small id="shutterSpeed">1/125s</small></div>
                <input type="range" id="shutterSpeedVal" min="2" max="1000" value="125">
            </div>
            <div class="row">
                <div class="name">Aperture <small id="aperture">f/16</small></div>
                <input type="range" id="apertureVal" min="1" max="32" step="1" value="16">
            </div>
            <div class="row">
                <div class="name">ISO <small id="ISO">100</small></div>
                <input type="range" id="ISOVal" min="50" max="8000" step="50" value="0">
            </div>
        <hr class="separator">
        <div class="row">
            <div class="name">Music <small id="musicPct">50%</small></div>
          <input type="range" id="musicVol" min="0" max="100" value="50">
        </div>
        <div class="row">
          <div class="name">Sound Effects <small id="sfxPct">50%</small></div>
          <input type="range" id="sfxVol" min="0" max="100" value="50">
        </div>
        <div class="hint">Press <kbd>Esc</kbd> to resume</div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
